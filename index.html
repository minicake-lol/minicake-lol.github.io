<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>八面 · 人生儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <small>Life OS · Private</small>
        <h1>八面</h1>
        <p id="hello">人生唔止一個面向。今日睇清楚自己偏咗邊。</p>
      </div>
      <div class="header-actions">
        <span class="sync-pill" id="sync-pill"><i></i><span>本機</span></span>
        <button class="btn ghost" id="btn-voice">粵語語音</button>
        <button class="btn ghost" data-go="review">週檢</button>
        <button class="btn primary" data-go="checkin">今日打卡</button>
      </div>
    </header>
    <section id="page-home" class="page active">
      <div class="grid home-grid">
        <div class="card"><h2>生命輪 <span class="muted" id="wheel-updated"></span></h2><canvas id="wheel" width="560" height="420"></canvas><div class="scores" id="score-list"></div></div>
        <div class="grid">
          <div class="card"><h2>今日狀態</h2><div class="muted" style="margin-bottom:8px">你而家能量點？決定今日係衝定係守。</div><div class="energy" id="energy"><button class="chip" data-energy="low">低 · 守</button><button class="chip" data-energy="mid">中 · 穩</button><button class="chip" data-energy="high">高 · 衝</button></div><div id="season-tag" class="muted" style="margin-top:12px"></div></div>
          <div class="card"><h2>今日一件被忽略嘅事</h2><div class="action-box" id="today-action"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="do-action">標記做咗</button><button class="btn ghost" id="shuffle-action">換一件</button></div></div>
          <div class="card"><h2>警報</h2><div id="alerts"></div></div>
          <div class="card"><h2>本週三件事</h2><div id="focus-list" class="list"></div><button class="btn" style="margin-top:10px" data-go="review">改本週焦點</button></div>
        </div>
      </div>
    </section>
    <section id="page-domains" class="page"><div class="grid domains-grid" id="domain-cards"></div></section>
    <section id="page-domain" class="page">
      <div class="row" style="margin-bottom:14px"><button class="btn ghost" data-go="domains">← 返八面</button></div>
      <div class="two">
        <div class="card">
          <h2 id="d-title">面向</h2>
          <label class="field">而家滿意度（1–10）</label><div class="range-wrap"><input id="d-score" type="range" min="1" max="10" /><b id="d-score-val">5</b></div>
          <label class="field">呢個階段只寫一個焦點</label><input id="d-focus" type="text" placeholder="例如：星期日一定回家食飯" />
          <label class="field">進行中（最多 3 件）</label><div id="d-tasks" class="list"></div>
          <div class="row" style="margin-top:8px"><input id="d-task-input" type="text" placeholder="加一件好細嘅事" /><button class="btn" id="d-add-task">加入</button></div>
          <label class="field">習慣（1–2 個）</label><div id="d-habits" class="list"></div>
          <div class="row" style="margin-top:8px"><input id="d-habit-input" type="text" placeholder="例如：每週主動搜一個朋友" /><button class="btn" id="d-add-habit">加入</button></div>
        </div>
        <div class="card"><h2>日誌</h2><textarea id="d-note" placeholder="今日呢個面向發生咗哪、你有哪感覺。"></textarea><button class="btn primary" style="margin-top:8px" id="d-save-note">存低呢則</button><div id="d-notes" class="history"></div></div>
      </div>
    </section>
    <section id="page-people" class="page"><div class="card"><h2>重要嘅人 <button class="btn primary" id="add-person">加人</button></h2><p class="muted" style="margin-bottom:12px">家庭同友情最容易斷線。呢度記低上次真心聯絡係幾時。</p><div id="people-list" class="list"></div></div></section>
    <section id="page-inner" class="page"><div class="two"><div class="card"><h2>人生宣言</h2><textarea id="manifesto" placeholder="我係邊種人。"></textarea><label class="field">核心價值</label><input id="values" type="text" placeholder="家人、誠實、健康" /><label class="field">不可破原則</label><textarea id="principles"></textarea><button class="btn primary" style="margin-top:12px" id="save-inner">儲存內心頁</button></div><div class="card"><h2>今日內心一問</h2><div class="action-box" id="prompt-box"></div><textarea id="prompt-ans" style="margin-top:10px"></textarea><button class="btn" style="margin-top:8px" id="save-prompt">寫低</button><div id="prompt-hist" class="history"></div></div></div></section>
    <section id="page-review" class="page"><div class="card"><h2>週檢</h2><div id="review-sliders"></div><label class="field">呢週邊度過熱／被忽略？</label><textarea id="review-neglect"></textarea><label class="field">一件想記住嘅小事</label><textarea id="review-win"></textarea><label class="field">下週三個焦點</label><textarea id="review-focus"></textarea><label class="field">模式</label><div class="energy" id="season-mode"><button class="chip" data-season="balance">平衡月</button><button class="chip" data-season="sprint">衝刺月</button></div><label class="field">衝刺完結與補償</label><input id="season-note" type="text" /><div class="row" style="margin-top:14px"><button class="btn primary" id="save-review">完成今次週檢</button></div><div id="review-hist" class="history"></div></div></section>
    <section id="page-checkin" class="page"><div class="card"><h2>今日打卡</h2><label class="field">能量</label><div class="energy" id="checkin-energy"><button class="chip" data-energy="low">低</button><button class="chip" data-energy="mid">中</button><button class="chip" data-energy="high">高</button></div><label class="field">今日花最多時間嘅面向</label><select id="checkin-hot"></select><label class="field">一句日誌</label><textarea id="checkin-note"></textarea><div class="row" style="margin-top:12px"><button class="btn primary" id="save-checkin">存今日</button><button class="btn" id="btn-voice-2">粵語語音打卡</button><button class="btn ghost" data-go="home">返總覽</button></div></div></section>
    <section id="page-settings" class="page"><div class="grid two"><div class="card"><h2>設定同備份</h2><label class="field">你點稱呼自己</label><input id="profile-name" type="text" /><button class="btn" style="margin-top:10px" id="save-name">儲存名稱</button><div class="row" style="margin-top:12px"><button class="btn" id="export-data">匯出 JSON</button><button class="btn" id="import-data">匯入 JSON</button><button class="btn danger" id="reset-data">清空全部</button></div><input type="file" id="import-file" accept="application/json" hidden /></div><div class="card"><h2>雲端同步</h2><p class="muted">資料先在你部機加密先上傳。</p><label class="field">雲端編號</label><input id="cloud-id" type="text" /><label class="field">同步密碼</label><input id="cloud-pass" type="password" /><label class="field" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="cloud-auto" checked /> 改動後自動上傳</label><div class="muted" id="cloud-status" style="margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="cloud-create">開通新雲端</button><button class="btn" id="cloud-pull">由雲端拉回</button><button class="btn" id="cloud-push">即刻上傳</button><button class="btn" id="cloud-copy">複製編號</button></div></div></div></section>
  </div>
  <nav class="nav"><button data-go="home" class="active">總覽</button><button data-go="domains">八面</button><button data-go="people">人物</button><button data-go="inner">內心</button><button data-go="review">週檢</button><button data-go="settings">設定</button></nav>
  <div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
  <div class="modal-bg" id="voice-modal"><div class="modal voice-shell"><h2 style="font-family:'Noto Serif TC',serif">粵語語音打卡</h2><div class="step-dots" id="voice-dots"><span class="on"></span><span></span><span></span></div><p class="muted" id="voice-q">而家能量高、中、定低？</p><button class="mic" id="mic-btn">講</button><div class="transcript" id="voice-live">等你講…</div><div class="muted" id="voice-parsed" style="margin-top:10px;text-align:left"></div><div class="row" style="margin-top:14px;justify-content:center"><button class="btn" id="voice-skip">呢題跳過</button><button class="btn primary" id="voice-save">確認存低</button><button class="btn ghost" id="voice-close">關閉</button></div></div></div>
  <script src="app.js"></script>
</body>
</html>
